[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsvault"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "sqlcipher3",
    "cryptography",
    "keyring",
    "python-ulid",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
# apps/ must be packaged too: the launchd units run `-m apps.mcp.server`, and the
# console script below resolves into it. With where=["src"] only, an installed
# wheel contained no `apps` at all and both entry points failed.
where = ["src", "."]
include = ["whatsvault*", "apps*"]

[tool.setuptools.package-data]
"whatsvault.db" = ["migrations/vault/*.sql", "migrations/control/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[project.scripts]
whatsvault = "whatsvault.cli.main:main"
whatsvault-mcp = "apps.mcp.server:main"
